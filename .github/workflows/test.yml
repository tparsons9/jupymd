name: Test JupyMD
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: macOS / Obsidian latest
    timeout-minutes: 25
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: 'test/requirements-*.txt'
      - run: npm ci
      - run: python test/setup-python.py
      - run: npm run test:typecheck
      - run: npm run test:unit
      - run: npm run test:integration
      - uses: actions/cache@v4
        with:
          path: .obsidian-cache
          key: obsidian-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - name: Obsidian acceptance tests
        run: npm run test:e2e
      - name: Known sync regressions (diagnostic, expected failures)
        if: always()
        continue-on-error: true
        run: npm run test:regressions
      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test-results/
            .test-env/*-freeze.txt
            .test-env/versions.json
          if-no-files-found: ignore
